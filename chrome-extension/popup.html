<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body {
      width: 340px;
      padding: 16px;
      margin: 0;
      background: #09090b;
      color: #f4f4f5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
    }
    .logo-badge {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #0077b5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      font-size: 18px;
    }
    .title-area h2 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
    }
    .title-area p {
      font-size: 11px;
      margin: 2px 0 0 0;
      color: #a1a1aa;
    }
    .account-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .account-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #27272a;
      object-fit: cover;
      flex-shrink: 0;
    }
    .account-info {
      flex: 1;
      min-width: 0;
    }
    .account-name {
      font-size: 13px;
      font-weight: 600;
      color: #f4f4f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-role {
      font-size: 11px;
      color: #a1a1aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 100px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      white-space: nowrap;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #f4f4f5;
      font-size: 11px;
      outline: none;
    }
    input:focus {
      border-color: #3b82f6;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-msg {
      margin-top: 12px;
      font-size: 11px;
      border-radius: 6px;
      padding: 8px 10px;
      display: none;
      line-height: 1.4;
    }
    .status-msg.success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-msg.error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .footer-text {
      margin-top: 12px;
      font-size: 10px;
      color: #71717a;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">in</div>
    <div class="title-area">
      <h2>OneInbox Connector</h2>
      <p>Automated Session Sync</p>
    </div>
  </div>

  <!-- Detected Account Profile Card -->
  <div id="accountCard" class="account-card" style="display: none;">
    <img id="accountAvatar" class="account-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Avatar">
    <div class="account-info">
      <div id="accountName" class="account-name">Detecting session...</div>
      <div id="accountRole" class="account-role">SDR</div>
    </div>
    <span id="accountBadge" class="badge">Active</span>
  </div>

  <div class="form-group">
    <label for="apiEndpoint">Platform API Endpoint</label>
    <input type="text" id="apiEndpoint" value="https://linkedin.snapsec.co/api/accounts/extension-connect">
  </div>

  <button id="connectBtn" class="btn">
    <span>Connect & Sync Account</span>
  </button>

  <div id="statusMsg" class="status-msg"></div>

  <div class="footer-text">
    Make sure you are logged into LinkedIn in this browser.
  </div>

  <script src="popup.js"></script>
</body>
</html>
